# Primary segment: agencies about to scale sending.
# Change this file and rerun to launch a new campaign.

name: agencies-hiring-outbound
description: >
  Outbound and lead generation agencies of 5 to 50 people that run
  Smartlead or Instantly and posted an outbound role in 90 days.

company:
  size_min: 5
  size_max: 50

techstack:
  any_of:
    - Smartlead
    - Instantly

signal:
  type: job_post
  lookback_days: 90
  title_keywords:
    - SDR
    - Sales Development Representative
    - outbound
    - cold email
    - deliverability
    - lead generation
    - business development
    - Business Development Representative

contacts:
  title_include:
    - founder
    - co-founder
    - ceo
    - head of growth
    - head of outbound
    - head of deliverability
    - operations lead
    - coo
  title_exclude:
    - sdr
    - account executive
    - intern
    - recruiter

output:
  limit: 100
